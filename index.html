<!DOCTYPE html>

<html lang="ja">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東方弾幕録-v1.0.0</title>
    <style>
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
        }

        div {
           white-space: pre-wrap;
        }

        #id {
            white-space: pre-wrap;
            width: 350px;
            word-break: break-all;
        }

        body {
            background: #222;
            color: white;
            text-align: center;
            overflow: hidden;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }



        canvas, #gameCanvas {
            background: #000;
            display: block;
            margin: 0 auto;
            border: 2px solid white;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: auto;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 384 / 448;
        }

        /* 画面上部に表示する可変画像用 */
        #topImages {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }

        #img64 {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #img16 {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* メイン操作UIをまとめる相対配置コンテナ（一覧ボタンの位置決め用） */
        #mainUiWrap {
            position: relative;
            display: inline-block;
        }

        /* 右上の「一覧」ボタン */
        #listOpenBtn {
            position: absolute;
            top: 0;
            right: -8px;
            transform: translateX(100%);
            background: #333;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        #listOpenBtn:hover {
            background: #444;
        }

        /* 「最新」ボタンは画面右上に固定表示 */
        #latestBtn {
            position: fixed !important;
            top: 8px !important;
            right: 8px !important;
            left: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: none !important;
            z-index: 999 !important;
            background: #333;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        #latestBtn:hover {
            background: #444;
        }

        /* 「ランダム」ボタン（最新ボタンの隣に固定表示） */
        #randomBtn {
            position: fixed !important;
            top: 8px !important;
            right: 76px !important;
            left: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: none !important;
            z-index: 999 !important;
            background: #333;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        #randomBtn:hover {
            background: #444;
        }

        /* ロゴ画像 */
        #logoImg {
            position: fixed !important;
            top: 140px !important;
            left: 50% !important;
            right: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: translateX(-50%) !important;
            z-index: 998 !important;
            width: min(92vw, 480px) !important;
            height: 60px !important;
            object-fit: contain;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        #logoImg.hidden {
            opacity: 0;
        }

        /* 左上の「シーズン」ボタン */
        #seasonBtn {
            position: fixed !important;
            top: 8px !important;
            left: 8px !important;
            right: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: none !important;
            z-index: 999 !important;
            background: #333;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        #seasonBtn:hover {
            background: #444;
        }

        /* 「シーズン」ボタンの右隣の「機体」ボタン */
        #charaBtn {
            position: fixed !important;
            top: 8px !important;
            left: 92px !important;
            right: auto !important;
            bottom: auto !important;
            margin: 0 !important;
            transform: none !important;
            z-index: 999 !important;
            background: #333;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        #charaBtn:hover {
            background: #444;
        }
        .charaRow {
            padding: 14px 16px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }
        .charaRow:hover {
            background: #2a2a2a;
        }
        .charaRow.current {
            background: #2a3a2a;
            color: #8f8;
        }
        .charaRow small {
            display: block;
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        /* シーズン選択モーダル */
        #seasonOverlay, #charaOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #seasonOverlay.open, #charaOverlay.open {
            display: flex;
        }
        #seasonPanel, #charaPanel {
            background: #1a1a1a;
            border: 2px solid #888;
            border-radius: 8px;
            width: min(360px, 90vw);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #seasonHeader, #charaHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #555;
            background: #222;
        }
        #seasonHeader span, #charaHeader span {
            font-weight: bold;
            font-size: 15px;
        }
        #seasonCloseBtn, #charaCloseBtn {
            background: #444;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #seasonCloseBtn:hover, #charaCloseBtn:hover {
            background: #555;
        }
        .seasonRow {
            padding: 14px 16px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }
        .seasonRow:hover {
            background: #2a2a2a;
        }
        .seasonRow.current {
            background: #2a3a2a;
            color: #8f8;
        }
        .seasonRow small {
            display: block;
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        /* スペル一覧モーダル */
        #spellListOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #spellListOverlay.open {
            display: flex;
        }
        #spellListPanel {
            background: #1a1a1a;
            border: 2px solid #888;
            border-radius: 8px;
            width: min(520px, 92vw);
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #spellListHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #555;
            background: #222;
        }
        #spellListHeader span {
            font-weight: bold;
            font-size: 15px;
        }
        #spellListCloseBtn {
            background: #444;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
        #spellListCloseBtn:hover {
            background: #555;
        }
        #spellListBody {
            overflow-y: auto;
            padding: 6px;
        }
        .spellRow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            text-align: left;
            white-space: normal;
        }
        .spellRow:hover {
            background: #2a2a2a;
        }
        .spellRow .spellNum {
            width: 34px;
            flex-shrink: 0;
            color: #aaa;
            font-size: 13px;
            text-align: right;
        }
        .spellRow .spellDifIcon {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }
        .spellRow .spellName {
            flex: 1;
            font-size: 14px;
        }
        .spellRow .spellMarkIcon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <script type="module">
        import { start } from './sys.js';
        import { stat } from "./engine.js";
        import { functions, getSeason, setSeason, sdKey, bossModulePaths, CHARAS, getChara, setChara } from "./functions.js";

        // 保存されているシーズンに応じて bossOld.js(シーズン-1) / boss0.js(シーズン0) / boss.js(シーズン1) / boss2.js(シーズン2) を読み込む。
        // 読み込まれたファイルが共有配列 functions にスペルを push する。
        {
            let loaded = false, lastErr;
            for (const path of bossModulePaths()) {
                try { await import(path); loaded = true; break; } catch (e) { lastErr = e; }
            }
            if (!loaded) console.error("bossファイルの読み込みに失敗しました:", lastErr);
        }

        // UI要素の生成と配置
        const mainUiWrap = document.createElement('div');
        mainUiWrap.id = "mainUiWrap";

        const input = document.createElement('input');
        input.type = 'text';
        input.id = "input";
        input.placeholder = '文字を入力してください';

        const div = document.createElement('div');
        div.id = "div";

        const button = document.createElement('button');
        button.id = "btn";
        button.type = "button";
        button.textContent = "遊ぶ";

        const sp = document.createElement('div');
        sp.id = "id";

        // 右上の「一覧」ボタン
        const listOpenBtn = document.createElement('button');
        listOpenBtn.id = "listOpenBtn";
        listOpenBtn.type = "button";
        listOpenBtn.textContent = "一覧";

        // 右上の「最新」ボタン（functions配列の末尾＝最新スペルを即プレイ）
        const latestBtn = document.createElement('button');
        latestBtn.id = "latestBtn";
        latestBtn.type = "button";
        latestBtn.textContent = "最新";

        // 右上の「ランダム」ボタン
        const randomBtn = document.createElement('button');
        randomBtn.id = "randomBtn";
        randomBtn.type = "button";
        randomBtn.textContent = "ランダム";

        // 左上の「シーズン」ボタン
        const seasonBtn = document.createElement('button');
        seasonBtn.id = "seasonBtn";
        seasonBtn.type = "button";
        seasonBtn.textContent = "シーズン";

        // 「シーズン」の右隣の「機体」ボタン
        const charaBtn = document.createElement('button');
        charaBtn.id = "charaBtn";
        charaBtn.type = "button";
        charaBtn.textContent = "機体";

        // ロゴ画像
        const logoImg = document.createElement('img');
        logoImg.id = "logoImg";
        logoImg.src = "./assets/logo.png";
        logoImg.alt = "ロゴ";

        // シーズン選択モーダル
        const seasonOverlay = document.createElement('div');
        seasonOverlay.id = "seasonOverlay";

        const seasonPanel = document.createElement('div');
        seasonPanel.id = "seasonPanel";

        const seasonHeader = document.createElement('div');
        seasonHeader.id = "seasonHeader";

        const seasonTitle = document.createElement('span');
        seasonTitle.textContent = "シーズン選択";

        const seasonCloseBtn = document.createElement('button');
        seasonCloseBtn.id = "seasonCloseBtn";
        seasonCloseBtn.type = "button";
        seasonCloseBtn.textContent = "閉じる";

        seasonHeader.append(seasonTitle, seasonCloseBtn);

        const seasonBody = document.createElement('div');
        seasonBody.id = "seasonBody";

        const seasonDefs = [
            { n: -1, label: "シーズン-1", note: "bossOld.js のスペル" },
            { n: 0, label: "シーズン0", note: "boss0.js のスペル" },
            { n: 1, label: "シーズン1", note: "ボスは無敵・ショットなし" },
            { n: 2, label: "シーズン2", note: "ボスに体力あり・ショットあり" },
        ];
        seasonDefs.forEach((def) => {
            const row = document.createElement('div');
            row.className = "seasonRow" + (getSeason() === def.n ? " current" : "");
            row.textContent = def.label + (getSeason() === def.n ? "（選択中）" : "");
            const note = document.createElement('small');
            note.textContent = def.note;
            row.append(note);
            row.addEventListener("click", () => {
                if (getSeason() === def.n) { closeSeason(); return; }
                // 選んだシーズンをローカルストレージに保存し、読み込み直して反映
                setSeason(def.n);
                location.reload();
            });
            seasonBody.append(row);
        });

        seasonPanel.append(seasonHeader, seasonBody);
        seasonOverlay.append(seasonPanel);

        function openSeason() {
            seasonOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }
        function closeSeason() {
            seasonOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }
        seasonBtn.addEventListener("click", openSeason);
        seasonCloseBtn.addEventListener("click", closeSeason);
        seasonOverlay.addEventListener("click", (e) => {
            if (e.target === seasonOverlay) closeSeason();
        });

        // 機体選択モーダル
        const charaOverlay = document.createElement('div');
        charaOverlay.id = "charaOverlay";

        const charaPanel = document.createElement('div');
        charaPanel.id = "charaPanel";

        const charaHeader = document.createElement('div');
        charaHeader.id = "charaHeader";

        const charaTitle = document.createElement('span');
        charaTitle.textContent = "機体選択";

        const charaCloseBtn = document.createElement('button');
        charaCloseBtn.id = "charaCloseBtn";
        charaCloseBtn.type = "button";
        charaCloseBtn.textContent = "閉じる";

        charaHeader.append(charaTitle, charaCloseBtn);

        const charaBody = document.createElement('div');
        charaBody.id = "charaBody";

        function renderCharaRows() {
            charaBody.textContent = "";
            CHARAS.forEach((def) => {
                const row = document.createElement('div');
                const isCur = getChara() === def.key;
                row.className = "charaRow" + (isCur ? " current" : "");
                row.textContent = def.label + (isCur ? "（選択中）" : "");
                const note = document.createElement('small');
                note.textContent = def.type;
                row.append(note);
                row.addEventListener("click", () => {
                    // 選んだ機体をローカルストレージに保存。次回以降も読み出される
                    setChara(def.key);
                    renderCharaRows();
                    closeChara();
                });
                charaBody.append(row);
            });
        }
        renderCharaRows();

        charaPanel.append(charaHeader, charaBody);
        charaOverlay.append(charaPanel);

        function openChara() {
            renderCharaRows();
            charaOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }
        function closeChara() {
            charaOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }
        charaBtn.addEventListener("click", openChara);
        charaCloseBtn.addEventListener("click", closeChara);
        charaOverlay.addEventListener("click", (e) => {
            if (e.target === charaOverlay) closeChara();
        });

        // スペル一覧モーダル（オーバーレイ＋パネル）
        const spellListOverlay = document.createElement('div');
        spellListOverlay.id = "spellListOverlay";

        const spellListPanel = document.createElement('div');
        spellListPanel.id = "spellListPanel";

        const spellListHeader = document.createElement('div');
        spellListHeader.id = "spellListHeader";

        const spellListTitle = document.createElement('span');
        spellListTitle.textContent = "スペル一覧";

        const spellListCloseBtn = document.createElement('button');
        spellListCloseBtn.id = "spellListCloseBtn";
        spellListCloseBtn.type = "button";
        spellListCloseBtn.textContent = "閉じる";

        spellListHeader.append(spellListTitle, spellListCloseBtn);

        const spellListBody = document.createElement('div');
        spellListBody.id = "spellListBody";

        spellListPanel.append(spellListHeader, spellListBody);
        spellListOverlay.append(spellListPanel);

        // 画面上部の可変画像コンテナと画像要素
        const topImages = document.createElement('div');
        topImages.id = "topImages";

        const img64 = document.createElement('img');
        img64.id = "img64";
        img64.alt = "";
        img64.style.display = "none";

        const img16 = document.createElement('img');
        img16.id = "img16";
        img16.alt = "";
        img16.style.display = "none";

        topImages.append(img64, img16);

        mainUiWrap.append(input, listOpenBtn);
        document.body.append(topImages, latestBtn, randomBtn, seasonBtn, charaBtn, logoImg, mainUiWrap, button, div, sp, spellListOverlay, seasonOverlay, charaOverlay);

        // 指定スペル番号(0始まり)でクリア状況を取得するヘルパー（シーズンごとに別データ）
        function getClearInfo(index0) {
            const storageData = localStorage.getItem(sdKey());
            if (!storageData) return { clear: false, noMiss: false };
            try {
                const parsed = JSON.parse(storageData);
                const clg = parsed ? parsed[index0] : null;
                const clear = (clg?.gets ?? 0) > 0;
                const noMiss = (clg?.nm ?? false) && clear;
                return { clear, noMiss };
            } catch (e) {
                console.error("Storage parse error:", e);
                return { clear: false, noMiss: false };
            }
        }

        // スペル一覧を描画（番号順、クリア/ノーミス状況付き）
        function renderSpellList() {
            spellListBody.textContent = "";

            functions.forEach((fn, i) => {
                if (!fn) return;

                const row = document.createElement('div');
                row.className = "spellRow";

                const num = document.createElement('span');
                num.className = "spellNum";
                num.textContent = String(i + 1);

                const difKey = (fn.dif ?? "e").toLowerCase();

                const difIcon = document.createElement('img');
                difIcon.className = "spellDifIcon";
                difIcon.alt = difKey;
                difIcon.src = "assets/" + difKey + ".png";

                const name = document.createElement('span');
                name.className = "spellName";
                name.textContent = fn.name ?? "無名";

                const markIcon = document.createElement('img');
                markIcon.className = "spellMarkIcon";
                const { clear, noMiss } = getClearInfo(i);
                if (noMiss) {
                    markIcon.src = "assets/nc.png";
                    markIcon.alt = "ノーミスクリア";
                    markIcon.title = "ノーミスクリア";
                } else if (clear) {
                    markIcon.src = "assets/c.png";
                    markIcon.alt = "クリア済み";
                    markIcon.title = "クリア済み";
                } else {
                    markIcon.style.visibility = "hidden";
                }

                row.append(num, difIcon, name, markIcon);

                // クリックで即ゲーム開始
                row.addEventListener("click", () => {
                    closeSpellList();
                    startSpell(i);
                });

                spellListBody.append(row);
            });
        }

        function openSpellList() {
            renderSpellList();
            spellListOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }

        function closeSpellList() {
            spellListOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }

        listOpenBtn.addEventListener("click", openSpellList);
        spellListCloseBtn.addEventListener("click", closeSpellList);
        spellListOverlay.addEventListener("click", (e) => {
            if (e.target === spellListOverlay) closeSpellList();
        });

        // 番号(0始まり)を指定してゲームを開始する共通処理
        function startSpell(sn) {
            if (sn < 0 || sn >= functions.length || !functions[sn]) return;

            // 画面上の入力UIを削除してゲームへ移行
            div.remove();
            mainUiWrap.remove();
            button.remove();
            sp.remove();
            topImages.remove();
            spellListOverlay.remove();
            seasonOverlay.remove();
            latestBtn.remove();
            randomBtn.remove();
            seasonBtn.remove();
            charaBtn.remove();
            charaOverlay.remove();
            logoImg.remove();

            cancelAnimationFrame(stat.gameId);
            // 通常プレイなのでチャレンジ関連の状態をリセット
            stat.isChallenge = false;
            stat.timeOverride = null;
            stat.timeQueue = [];
            stat.ntxt = "";
            stat.rushId = null;
            start(sn);
        }

        // 最新ボタン：functions配列の末尾から遡って有効なスペルを即プレイ
        function playLatestSpell() {
            for (let i = functions.length - 1; i >= 0; i--) {
                if (functions[i]) {
                    startSpell(i);
                    return;
                }
            }
            div.style.backgroundColor = "white";
            div.style.color = "#D40014";
            div.textContent = "プレイ可能なスペルカードが見つかりませんでした。";
        }

        // ランダムボタン：有効なスペルから1つを無作為に即プレイ
        function playRandomSpell() {
            const validIndexes = [];
            for (let i = 0; i < functions.length; i++) {
                if (functions[i]) validIndexes.push(i);
            }

            if (validIndexes.length === 0) {
                div.style.backgroundColor = "white";
                div.style.color = "#D40014";
                div.textContent = "プレイ可能なスペルカードが見つかりませんでした。";
                return;
            }

            const pick = validIndexes[Math.floor(Math.random() * validIndexes.length)];
            startSpell(pick);
        }

        latestBtn.addEventListener("click", playLatestSpell);
        randomBtn.addEventListener("click", playRandomSpell);

        // ボタンクリック時の処理（バリデーションとゲーム開始）
        function buttonPush() {
            const spell = input.value;
            const sn = Number(spell) - 1;

            div.style.backgroundColor = "white";
            div.style.color = "#D40014";
            div.textContent = "";

            // ストレージクリアコマンド
            if (spell === "$()") {
                localStorage.clear();
                const n = localStorage.getItem(sdKey());
                div.textContent = `正常にローカルストレージをクリアしました。${n}`;
                return;
            }

            if (!spell) {
                div.textContent = "文字が入力されていません。";
                return;
            }
            if (isNaN(sn) || sn < 0 || Number(spell) <= 0) {
                div.textContent = `入力された値\n${spell}\nは不正です。${functions.length}以下の半角数字を入力してください`;
                return;
            }
            if (sn >= functions.length || !functions[sn]) {
                div.textContent = "存在していないスペルカードです。スペルナンバーを下げるまたは再確認してやり直してね";
                return;
            }

            startSpell(sn);
        }

        // 入力時のリアルタイムプレビュー処理
        function checkInput() {
            const v = Number(input.value) - 1;
            const fn = functions[v];

            if (!fn) {
                sp.textContent = "";
                img64.style.display = "none";
                img16.style.display = "none";
                return;
            }

            const storageData = localStorage.getItem(sdKey());
            let clg = null;
            if (storageData) {
                try {
                    const parsed = JSON.parse(storageData);
                    if (parsed && parsed[v]) {
                        clg = parsed[v];
                    }
                } catch (e) {
                    console.error("Storage parse error:", e);
                }
            }

            div.textContent = "";

            const name = fn.name ?? "無名";
            const desc = fn.desc ?? "説明文はまだ書かれていません。";
            const time = fn.time ? "制限時間:" + fn.time + "s" : "";
            const limit = fn.limit ? "特殊変化:" + fn.limit : "";
            const hint = fn.hint ?? "";

            const g = String(clg?.gets ?? 0).padStart(3, "0");
            const am = String(clg?.amount ?? 0).padStart(3, "0");
            const clear = (clg?.gets ?? 0) > 0;
            const nm = clg?.nm ?? false;
            const LastClear = nm && clear ? "assets/nc.png" : "assets/c.png";
            sp.textContent = `
名前:${name}

説明文:${desc}

${time} | ${limit} 

ヒント:${hint}

${g}/${am}`;

            // 64x64画像：クリア済みなら表示
            img64.src = LastClear;
            img64.style.display = clear ? "block" : "none";

            // 16x16画像：fn.dif（E/N/H/L）に応じて難易度画像を切り替え
            const difPath = fn.dif ? "assets/" + fn.dif + ".png" : "assets/e.png";
            img16.src = difPath;
            img16.style.display = "block";
        }

        button.addEventListener("click", buttonPush);
        input.addEventListener("input", checkInput);

        // 文字入力欄にフォーカスしたらロゴを隠し、離れたら再表示する
        input.addEventListener("focus", () => {
            logoImg.classList.add("hidden");
        });
        input.addEventListener("blur", () => {
            logoImg.classList.remove("hidden");
        });
    </script>
</body>
</html>
