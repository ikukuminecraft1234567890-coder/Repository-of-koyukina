        } from "./rush.js";

        // 💡追加：16x16画像のdif値ごとのパス対応表（あとで自由に書き換えてください）

        listOpenBtn.id = "listOpenBtn";

        const logoImg = document.createElement('img');
        logoImg.id = "logoImg";
        logoImg.src = "./assets/logo.png";
        logoImg.alt = "ロゴ";

        // 💡追加：スペル一覧モーダル（オーバーレイ＋パネル）
        const spellListOverlay = document.createElement('div');
        spellListOverlay.id = "spellListOverlay";

        const spellListPanel = document.createElement('div');
        spellListPanel.id = "spellListPanel";

        rushListHeaderBtns.className = "rhBtns";

        rushImportFileInput.accept = ".txt";

        rushNewBtn.type = "button";

        const rushListCloseBtn = document.createElement('button');

        rushEditorTitle.textContent = "弾幕ラッシュエディター";

        rushEditorCloseBtn.className = "rushHeaderBtn";
        rushEditorCloseBtn.type = "button";
        rushEditorCloseBtn.textContent = "閉じる";

        rushEditorHeader.append(rushEditorTitle, rushEditorCloseBtn);

        const rushEditorBody = document.createElement('div');
        rushEditorBody.id = "rushEditorBody";

        // --- 基本情報フォーム ---
        function makeFormRow(labelText, inputEl) {
            const row = document.createElement('div');
            row.className = "rushFormRow";
            const label = document.createElement('label');
            label.textContent = labelText;
            row.append(label, inputEl);
            return row;
        }

        const reNameInput = document.createElement('input');
        reNameInput.type = "text";
        reNameInput.placeholder = "ラッシュの名前";

        const reDescInput = document.createElement('textarea');
        reDescInput.placeholder = "説明文";

        const reDifSelect = document.createElement('select');
        [["e","Easy"],["n","Normal"],["h","Hard"],["l","Lunatic"],["p","Phantasm"]].forEach(([v,l]) => {
            const opt = document.createElement('option');
            opt.value = v; opt.textContent = `${v.toUpperCase()} (${l})`;
            reDifSelect.append(opt);
        });

        const reMissInput = document.createElement('input');
        reMissInput.type = "number";
        reMissInput.min = "0";
        reMissInput.value = "5";

        const reCtInput = document.createElement('textarea');
        reCtInput.placeholder = "クリアテキスト";

        const reNmInput = document.createElement('textarea');
        reNmInput.placeholder = "ノーミスクリアテキスト";

        const topFormWrap = document.createElement('div');
        const inlineRow1 = document.createElement('div');
        inlineRow1.className = "rushFormRowInline";

            makeFormRow("名前", reNameInput),
            makeFormRow("難易度アイコン", reDifSelect),
            makeFormRow("許容ミス数（合計）", reMissInput)
        );
        topFormWrap.append(
            inlineRow1,
            makeFormRow("説明文", reDescInput),
            makeFormRow("クリアテキスト", reCtInput),
            makeFormRow("ノーミスクリアテキスト", reNmInput)
        );

        // --- 弾幕（スペル）リスト ---
        const entryListLabel = document.createElement('div');
        entryListLabel.className = "rushFormRow";
        const entryListLabelText = document.createElement('label');
        entryListLabelText.textContent = "弾幕リスト（上から順に実行されます）";
        entryListLabel.append(entryListLabelText);

        const rushEntryList = document.createElement('div');
        rushEntryList.id = "rushEntryList";

        const rushAddEntryRow = document.createElement('div');
        rushAddEntryRow.id = "rushAddEntryRow";

        const addEntrySelect = document.createElement('select');
        function refreshAddEntrySelect() {
            addEntrySelect.textContent = "";
            functions.forEach((fn, i) => {
                if (!fn) return;
                const opt = document.createElement('option');
                opt.value = String(i + 1);
                opt.textContent = `${i + 1}. ${fn.name ?? "無名"}`;
                addEntrySelect.append(opt);
            });
        }

        const addEntryBtn = document.createElement('button');
        addEntryBtn.className = "rushHeaderBtn";
        addEntryBtn.type = "button";
        addEntryBtn.textContent = "追加";

        rushAddEntryRow.append(addEntrySelect, addEntryBtn);

        rushMsg.id = "rushMsg";

        topImages.id = "topImages";

        const img64 = document.createElement('img');
        img64.id = "img64";
        img64.alt = "";
        img64.style.display = "none";

        const img16 = document.createElement('img');
        img16.id = "img16";
        img16.alt = "";
        img16.style.display = "none";

        topImages.append(img64, img16);

        mainUiWrap.append(input, listOpenBtn);
        document.body.append(topImages, latestBtn, randomBtn, customBtn, logoImg, mainUiWrap, button, div, sp, spellListOverlay, rushListBtn, rushListOverlay, rushEditorOverlay);

        // 初期化処

        // 💡変更：「実行」ボタン → 弾幕ラッシュエディターを新規作成モードで開く
        function customFunction() {
            openRushEditor(null);
        }

        customBtn.addEventListener("click", customFunction);

        // ==========================================================
        // 💡追加：弾幕ラッシュ機能
        // ==========================================================

        let editingRushId = null;   // 編集中のラッシュid（nullなら新規作成）
        let entries = [];           // [{spell:1始まり, time:number|null}]

        function genRushId() {
            return "rush_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        }

        // --- ラッシュ一覧モーダル ---
        function renderRushList() {
            rushListBody.textContent = "";
            const rushes = loadRushes();

            if (rushes.length === 0) {
                const empty = document.createElement('div');
                empty.id = "rushListEmpty";
                empty.textContent = "まだ弾幕ラッシュがありません。「新規作成」または「インポート」で追加してください。";
                rushListBody.append(empty);
                return;
            }

            rushes.forEach((rush) => {
                const row = document.createElement('div');
                row.className = "rushRow";

                const difIcon = document.createElement('img');
                difIcon.className = "rushDifIcon";
                const difKey = (rush.dif ?? "n").toLowerCase();
                difIcon.alt = difKey;
                difIcon.src = "assets/" + difKey + ".png";

                const name = document.createElement('span');
                name.className = "rushName";
                name.textContent = rush.name ?? "無名のラッシュ";

                const markIcon = document.createElement('img');
                markIcon.className = "rushMarkIcon";
                const { clear, noMiss } = getRushClearInfo(rush.id);
                if (noMiss) {
                    markIcon.src = "assets/nc.png";
                    markIcon.alt = "ノーミスクリア";
                    markIcon.title = "ノーミスクリア";
                } else if (clear) {
                    markIcon.src = "assets/c.png";
                    markIcon.alt = "クリア済み";
                    markIcon.title = "クリア済み";
                } else {
                    markIcon.style.visibility = "hidden";
                }

                const editBtn = document.createElement('button');
                editBtn.className = "rushExportBtn";
                editBtn.textContent = "編集";
                editBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    closeRushList();
                    openRushEditor(rush);
                });

                const exportBtn = document.createElement('button');
                exportBtn.className = "rushExportBtn";
                exportBtn.textContent = "書出";
                exportBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    downloadRushAsTxt(rush);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = "rushDeleteBtn";
                deleteBtn.textContent = "削除";
                deleteBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (confirm(`「${rush.name}」を削除しますか？`)) {
                        deleteRush(rush.id);
                        renderRushList();
                    }
                });

                row.append(difIcon, name, markIcon, editBtn, exportBtn, deleteBtn);

                // 行クリックで即プレイ
                row.addEventListener("click", () => {
                    closeRushList();
                    div.remove();
                    mainUiWrap.remove();
                    button.remove();
                    sp.remove();
                    topImages.remove();
                    spellListOverlay.remove();
                    rushListOverlay.remove();
                    rushEditorOverlay.remove();
                    latestBtn.remove();
                    randomBtn.remove();
                    customBtn.remove();
                    logoImg.remove();
                    rushListBtn.remove();
                    cancelAnimationFrame(stat.gameId);
                    startRush(rush);
                });

                rushListBody.append(row);
            });
        }

        function openRushList() {
            renderRushList();
            rushListOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }
        function closeRushList() {
            rushListOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }

        rushListBtn.addEventListener("click", openRushList);
        rushListCloseBtn.addEventListener("click", closeRushList);
        rushListOverlay.addEventListener("click", (e) => {
            if (e.target === rushListOverlay) closeRushList();
        });

        rushNewBtn.addEventListener("click", () => {
            closeRushList();
            openRushEditor(null);
        });

        rushImportBtn.addEventListener("click", () => rushImportFileInput.click());
        rushImportFileInput.addEventListener("change", async () => {
            const file = rushImportFileInput.files[0];
            rushImportFileInput.value = "";
            if (!file) return;
            try {
                const rush = await importRushFromFile(file);
                addRush(rush);
                renderRushList();
            } catch (e) {
                alert("インポートに失敗しました：" + e.message);
            }
        });

        // --- ラッシュエディター ---
        function renderEntryList() {
            rushEntryList.textContent = "";
            entries.forEach((entry, i) => {
                const row = document.createElement('div');
                row.className = "rushEntryRow";

                const idx = document.createElement('span');
                idx.className = "reIndex";
                idx.textContent = String(i + 1);

                const select = document.createElement('select');
                functions.forEach((fn, fi) => {
                    if (!fn) return;
                    const opt = document.createElement('option');
                    opt.value = String(fi + 1);
                    opt.textContent = `${fi + 1}. ${fn.name ?? "無名"}`;
                    if (fi + 1 === entry.spell) opt.selected = true;
                    select.append(opt);
                });
                select.addEventListener("change", () => {
                    entry.spell = Number(select.value);
                });

                const timeInput = document.createElement('input');
                timeInput.type = "number";
                timeInput.min = "0";
                timeInput.step = "0.1";
                const defaultTime = functions[entry.spell - 1]?.time ?? "";
                timeInput.placeholder = "既定:" + defaultTime + "s";
                timeInput.value = entry.time !== null && entry.time !== undefined ? entry.time : "";
                timeInput.addEventListener("input", () => {
                    entry.time = timeInput.value === "" ? null : Number(timeInput.value);
                });

                const upBtn = document.createElement('button');
                upBtn.className = "reMove";
                upBtn.textContent = "↑";
                upBtn.disabled = i === 0;
                upBtn.addEventListener("click", () => {
                    if (i === 0) return;
                    [entries[i - 1], entries[i]] = [entries[i], entries[i - 1]];
                    renderEntryList();
                });

                const downBtn = document.createElement('button');
                downBtn.className = "reMove";
                downBtn.textContent = "↓";
                downBtn.disabled = i === entries.length - 1;
                downBtn.addEventListener("click", () => {
                    if (i === entries.length - 1) return;
                    [entries[i + 1], entries[i]] = [entries[i], entries[i + 1]];
                    renderEntryList();
                });

                const removeBtn = document.createElement('button');
                removeBtn.className = "reRemove";
                removeBtn.textContent = "削除";
                removeBtn.addEventListener("click", () => {
                    entries.splice(i, 1);
                    renderEntryList();
                });

                row.append(idx, select, timeInput, upBtn, downBtn, removeBtn);
                rushEntryList.append(row);
            });

            if (entries.length === 0) {
                const empty = document.createElement('div');
                empty.style.padding = "10px";
                empty.style.color = "#888";
                empty.style.fontSize = "12px";
                empty.textContent = "弾幕がまだ追加されていません。下のプルダウンから追加してください。";
                rushEntryList.append(empty);
            }
        }

        addEntryBtn.addEventListener("click", () => {
            const v = Number(addEntrySelect.value);
            if (!v) return;
            entries.push({ spell: v, time: null });
            renderEntryList();
        });

        function buildRushFromForm() {
            const name = reNameInput.value.trim();
            if (!name) throw new Error("名前を入力してください。");
            if (entries.length === 0) throw new Error("弾幕を1つ以上追加してください。");
            const misses = Number(reMissInput.value);
            return {
                id: editingRushId || genRushId(),
                name,
                desc: reDescInput.value,
                dif: reDifSelect.value,
                misses: Number.isFinite(misses) && misses >= 0 ? misses : 5,
                ct: reCtInput.value,
                nm: reNmInput.value,
                entries: entries.map(e => ({ spell: e.spell, time: e.time }))
            };
        }

        function openRushEditor(rush) {
            rushMsg.textContent = "";
            refreshAddEntrySelect();

            if (rush) {
                editingRushId = rush.id;
                reNameInput.value = rush.name ?? "";
                reDescInput.value = rush.desc ?? "";
                reDifSelect.value = rush.dif ?? "n";
                reMissInput.value = rush.misses ?? 5;
                reCtInput.value = rush.ct ?? "";
                reNmInput.value = rush.nm ?? "";
                entries = (rush.entries ?? []).map(e => ({ spell: e.spell, time: e.time ?? null }));
            } else {
                editingRushId = null;
                reNameInput.value = "";
                reDescInput.value = "";
                reDifSelect.value = "n";
                reMissInput.value = "5";
                reCtInput.value = "";
                reNmInput.value = "";
                entries = [];
            }

            renderEntryList();
            rushEditorOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }

        function closeRushEditor() {
            rushEditorOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }

        rushEditorCloseBtn.addEventListener("click", closeRushEditor);
        rushEditorOverlay.addEventListener("click", (e) => {
            if (e.target === rushEditorOverlay) closeRushEditor();
        });

        rushSaveBtn.addEventListener("click", () => {
            try {
                const rush = buildRushFromForm();
                editingRushId = rush.id;
                addRush(rush);
                rushMsg.style.color = "#8f8";
                rushMsg.textContent = "保存しました。";
            } catch (e) {
                rushMsg.style.color = "#ffb347";
                rushMsg.textContent = e.message;
            }
        });

        rushExportCurrentBtn.addEventListener("click", () => {
            try {
                const rush = buildRushFromForm();
                downloadRushAsTxt(rush);
            } catch (e) {
                rushMsg.style.color = "#ffb347";
                rushMsg.textContent = e.message;
            }
        });

        // 💡追加：指定スペル番号(1始まり)でクリア状況を取得するヘルパー
        function getClearInfo(index0) {
            const storageData = localStorage.getItem("sd");
            if (!storageData) return { clear: false, noMiss: false };
            try {
                const parsed = JSON.parse(storageData);
                const clg = parsed ? parsed[index0] : null;
                const clear = (clg?.gets ?? 0) > 0;
                const noMiss = (clg?.nm ?? false) && clear;
                return { clear, noMiss };
            } catch (e) {
                console.error("Storage parse error:", e);
                return { clear: false, noMiss: false };
            }
        }

        // 💡追加：スペル一覧を描画（番号順、クリア/ノーミス状況付き）
        function renderSpellList() {
            spellListBody.textContent = "";

            functions.forEach((fn, i) => {
                if (!fn) return;

                const row = document.createElement('div');
                row.className = "spellRow";

                const num = document.createElement('span');
                num.className = "spellNum";
                num.textContent = String(i + 1);

                const difKey = (fn.dif ?? "e").toLowerCase();

                const difIcon = document.createElement('img');
                difIcon.className = "spellDifIcon";
                difIcon.alt = difKey;
                difIcon.src = "assets/" + difKey + ".png";

                const name = document.createElement('span');
                name.className = "spellName";
                name.textContent = fn.name ?? "無名";

                // 💡クリア/ノーミスクリアの画像アイコン（未クリアなら空のまま非表示）
                const markIcon = document.createElement('img');
                markIcon.className = "spellMarkIcon";
                const { clear, noMiss } = getClearInfo(i);
                if (noMiss) {
                    markIcon.src = "assets/nc.png";
                    markIcon.alt = "ノーミスクリア";
                    markIcon.title = "ノーミスクリア";
                } else if (clear) {
                    markIcon.src = "assets/c.png";
                    markIcon.alt = "クリア済み";
                    markIcon.title = "クリア済み";
                } else {
                    markIcon.style.visibility = "hidden";
                }

                row.append(num, difIcon, name, markIcon);

                // 💡クリックで即ゲーム開始（別フォーム扱い）
                row.addEventListener("click", () => {
                    closeSpellList();
                    startSpell(i);
                });

                spellListBody.append(row);
            });
        }

        function openSpellList() {
            renderSpellList();
            spellListOverlay.classList.add("open");
            logoImg.classList.add("hidden");
        }

        function closeSpellList() {
            spellListOverlay.classList.remove("open");
            logoImg.classList.remove("hidden");
        }

        listOpenBtn.addEventListener("click", openSpellList);
        spellListCloseBtn.addEventListener("click", closeSpellList);
        // 💡背景クリックでも閉じられるように
        spellListOverlay.addEventListener("click", (e) => {
            if (e.target === spellListOverlay) closeSpellList();
        });

        // 💡追加：番号(0始まり)を指定してゲームを開始する共通処理
        function startSpell(sn) {
            if (sn < 0 || sn >= functions.length || !functions[sn]) return;

            // 画面上の入力UIを削除してゲームへ移行
            div.remove();
            mainUiWrap.remove();
            button.remove();
            sp.remove();
            topImages.remove();
            spellListOverlay.remove();
            rushListOverlay.remove();
            rushEditorOverlay.remove();
            rushListBtn.remove();
            latestBtn.remove();
            randomBtn.remove();
            customBtn.remove();
            logoImg.remove();

            cancelAnimationFrame(stat.gameId);
            // 💡通常プレイなので弾幕ラッシュ関連の状態をリセット
            stat.isChallenge = false;
            stat.timeOverride = null;
            stat.timeQueue = [];
            stat.ntxt = "";
            stat.rushId = null;
            start(sn);
        }

        // 💡追加：最新ボタン押下時の処理。functions配列の末尾から遡って
        // 有効なエントリ（nullや未定義でないもの）を探して即プレイする。
        function playLatestSpell() {
            for (let i = functions.length - 1; i >= 0; i--) {
                if (functions[i]) {
                    startSpell(i);
                    return;
                }
            }
            // 有効なスペルが1つも見つからなかった場合の通知
            div.style.backgroundColor = "white";
            div.style.color = "#D40014";
            div.textContent = "プレイ可能なスペルカードが見つかりませんでした。";
        }

        // 💡追加：ランダムボタン押下時の処理。有効なスペル(null/undefinedでないもの)の
        // インデックスを集めておき、その中から1つを無作為に選んで即プレイする。
        function playRandomSpell() {
            const validIndexes = [];
            for (let i = 0; i < functions.length; i++) {
                if (functions[i]) validIndexes.push(i);
            }

            if (validIndexes.length === 0) {
                div.style.backgroundColor = "white";
                div.style.color = "#D40014";
                div.textContent = "プレイ可能なスペルカードが見つかりませんでした。";
                return;
            }

            const pick = validIndexes[Math.floor(Math.random() * validIndexes.length)];
            startSpell(pick);
        }

        latestBtn.addEventListener("click", playLatestSpell);
        randomBtn.addEventListener("click", playRandomSpell);

        // ボタンクリック時の処理（バリデーションとゲーム開始）
        function buttonPush() {
            const spell = input.value;
            const sn = Number(spell) - 1; // 💡修正：可読性のため spell - 1 ではなく明示的にNumberにキャスト
            
            div.style.backgroundColor = "white"; // 💡修正: 'lightwhite'という色は存在しないため'white'に変更
            div.style.color = "#D40014";        // 💡修正: # を追加
            div.textContent = "";

            // ストレージクリアコマンド
            if (spell === "$()") {
                localStorage.clear();
                const n = localStorage.getItem("sd");
                div.textContent = `正常にローカルストレージをクリアしました。${n}`;
                return;
            }

            // エラーチェック（早期リターン（Early Return）ガード句）
            if (!spell) {
                div.textContent = "文字が入力されていません。";
                return;
            }
            if (isNaN(sn) || sn < 0 || Number(spell) <= 0) {
                div.textContent = `入力された値\n${spell}\nは不正です。${functions.length}以下の半角数字を入力してください`;
                return;
            }
            if (sn >= functions.length || !functions[sn]) {
                div.textContent = "存在していないスペルカードです。スペルナンバーを下げるまたは再確認してやり直してね";
                return;
            }

            startSpell(sn);
        }

        // 入力時のリアルタイムプレビュー処理
        function checkInput() {
            const v = Number(input.value) - 1;
            const fn = functions[v];

            // 💡安全対策：該当するスペルデータがない（範囲外など）なら処理しない
            if (!fn) {
                sp.textContent = "";
                img64.style.display = "none"; // 💡追加：無効な入力なら画像を隠す
                img16.style.display = "none";
                return;
            }

            // 💡安全対策：localStorageが空、またはデータが壊れていてもクラッシュしないように分解
            const storageData = localStorage.getItem("sd");
            let clg = null;
            if (storageData) {
                try {
                    const parsed = JSON.parse(storageData);
                    if (parsed && parsed[v]) {
                        clg = parsed[v];
                    }
                } catch (e) {
                    console.error("Storage parse error:", e);
                }
            }

            div.textContent = ""; // 💡バグ修正: diva ではなく div。エラー文の初期化

            const name = fn.name ?? "無名";
            const desc = fn.desc ?? "説明文はまだ書かれていません。";
            const time = fn.time ? "制限時間:" + fn.time + "s" : "";
            const limit = fn.limit ? "特殊変化:" + fn.limit : "";
            const hint = fn.hint ?? "";
            
            const g = String(clg?.gets ?? 0).padStart(3, "0");
            const am = String(clg?.amount ?? 0).padStart(3, "0");
const clear = (clg?.gets ?? 0) > 0
const nm = clg?.nm ?? false
const LastClear = nm && clear ? "assets/nc.png" : "assets/c.png"
            sp.textContent = `
名前:${name}

説明文:${desc}

${time} | ${limit} 

ヒント:${hint}

${g}/${am}`;

            // 💡追加：64x64画像 → clg.nc（true/false）に応じてクリア/未クリア画像を切り替え
            const nc = clg?.nc ?? false;
            img64.src = LastClear;
const a = clear ? "block" : "none"
            img64.style.display = a;

            // 💡追加：16x16画像 → fn.dif（E/N/H/L）に応じて難易度画像を切り替え
            const difPath = fn.dif ? "assets/"+fn.dif+".png" : "assets/e.png"
            if (difPath) {
                img16.src = difPath;
                img16.style.display = "block";
            } else {
                img16.style.display = "none";
            }
        }

        // イベントリスナーの登録
        button.addEventListener("click", buttonPush);
        input.addEventListener("input", checkInput);

        // 💡追加：文字入力欄にフォーカスしたらロゴを隠し、離れたら再表示する
        input.addEventListener("focus", () => {
            logoImg.classList.add("hidden");
        });
        input.addEventListener("blur", () => {
            logoImg.classList.remove("hidden");
        });

        // タッチ制御用（必要に応じてセットアップ）
        setTimeout(() => {
            const canvasElement = document.getElementById("gameCanvas");
            if (!canvasElement) return;

            let lastTouchX = 0;
            let lastTouchY = 0;
        }, 100);
    </script>
</body>
</html>
